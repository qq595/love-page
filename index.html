<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title> 三木雅</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 200% 200%;
            animation: gradientShift 8s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 15px;
            position: relative;
            overflow: hidden;
            transition: background 1.5s ease-in-out;
        }

        body.show-background {
            animation: none;
        }

        /* 图片轮播容器 */
        .slideshow-container {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        body.show-background .slideshow-container {
            display: block;
        }

        .slideshow-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            box-shadow: inset 0 0 100px rgba(255, 182, 193, 0.3),
                        inset 0 0 50px rgba(255, 107, 107, 0.2);
        }

        .slideshow-image.active {
            opacity: 1;
        }

        body.show-background::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, 
                rgba(102, 126, 234, 0.3) 0%, 
                rgba(118, 75, 162, 0.2) 50%, 
                rgba(240, 147, 251, 0.3) 100%);
            background-size: 200% 200%;
            animation: gradientShift 8s ease infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 25px;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                        0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            text-align: center;
            max-width: 500px;
            width: 100%;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(10px);
            animation: containerFloat 3s ease-in-out infinite;
            transition: opacity 1s ease-out, transform 1s ease-out;
        }

        .container.hide {
            opacity: 0;
            transform: scale(0.8);
            pointer-events: none;
        }

        @keyframes containerFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        .heart-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 200px;
            opacity: 0.05;
            z-index: 0;
            animation: heartBeatSlow 2s ease-in-out infinite;
        }

        @keyframes heartBeatSlow {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }

        .question {
            font-size: 36px;
            color: #333;
            margin-bottom: 25px;
            font-weight: bold;
            position: relative;
            z-index: 1;
        }

        @media (min-width: 480px) {
            .question { font-size: 48px; }
        }

        .input-group {
            margin: 25px 0;
            position: relative;
            z-index: 1;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 18px;
            font-size: 22px;
            border: 2px solid #ddd;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s ease;
            outline: none;
            background: rgba(255, 255, 255, 0.9);
        }

        @media (min-width: 480px) {
            input[type="text"] {
                padding: 15px 20px;
                font-size: 24px;
            }
        }

        input[type="text"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 15px rgba(102, 126, 234, 0.4);
            transform: scale(1.02);
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 40px;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            position: relative;
            z-index: 1;
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
            width: 100%;
            max-width: 200px;
        }

        @media (min-width: 480px) {
            button {
                padding: 15px 50px;
                font-size: 20px;
            }
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.5);
        }

        button:active {
            transform: translateY(0) scale(0.98);
        }

        .message {
            font-size: 28px;
            color: #e74c3c;
            font-weight: bold;
            margin-top: 20px;
            animation: fadeIn 0.5s ease, pulse 1.5s infinite;
            display: none;
            position: relative;
            z-index: 1;
            background: linear-gradient(45deg, #e74c3c, #ff6b6b, #e056fd);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @media (min-width: 480px) {
            .message { font-size: 36px; }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .error {
            color: #e74c3c;
            font-size: 16px;
            margin-top: 10px;
            display: none;
            position: relative;
            z-index: 1;
            animation: shake 0.5s;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* 满屏飘落效果 */
        .falling {
            position: fixed;
            animation: fall linear infinite, heartBeat 0.8s ease-in-out infinite;
            pointer-events: none;
            z-index: 9999;
            white-space: nowrap;
            font-weight: bold;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
            opacity: 0.3;
        }

        @keyframes fall {
            0% {
                top: -50px;
                opacity: 0.3;
            }
            80% { opacity: 0.3; }
            100% {
                top: 100vh;
                opacity: 0;
            }
        }

        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* 上升爱心效果 */
        .rising-heart {
            position: fixed;
            animation: rise linear infinite;
            pointer-events: none;
            z-index: 9999;
        }

        @keyframes rise {
            0% {
                bottom: -50px;
                opacity: 1;
                transform: rotate(0deg);
            }
            100% {
                bottom: 100vh;
                opacity: 0;
                transform: rotate(360deg);
            }
        }

        /* 闪烁星星 */
        .sparkle {
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            animation: sparkleAnim 2s ease-in-out infinite;
        }

        @keyframes sparkleAnim {
            0%, 100% {
                opacity: 0;
                transform: scale(0) rotate(0deg);
            }
            50% {
                opacity: 1;
                transform: scale(1) rotate(180deg);
            }
        }

        /* 大爱心爆裂 */
        .big-heart {
            position: fixed;
            pointer-events: none;
            z-index: 9997;
            animation: bigHeartAnim 2s ease-out forwards;
        }

        @keyframes bigHeartAnim {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 0;
            }
            30% {
                transform: scale(1.5) rotate(15deg);
                opacity: 1;
            }
            100% {
                transform: scale(2) rotate(-15deg);
                opacity: 0;
            }
        }

        /* 光环扩散 */
        .ring {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 9996;
            border: 3px solid #ff6b6b;
            border-radius: 50%;
            animation: ringExpand 2s ease-out forwards;
        }

        @keyframes ringExpand {
            0% {
                width: 0;
                height: 0;
                opacity: 1;
            }
            100% {
                width: 600px;
                height: 600px;
                opacity: 0;
            }
        }

        /* 漂浮气泡 */
        .bubble {
            position: fixed;
            bottom: -100px;
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,182,193,0.4));
            border-radius: 50%;
            pointer-events: none;
            z-index: 9995;
            animation: bubbleFloat linear infinite;
            box-shadow: inset 0 0 10px rgba(255,255,255,0.5);
        }

        @keyframes bubbleFloat {
            0% {
                bottom: -100px;
                opacity: 0;
                transform: translateX(0);
            }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% {
                bottom: 110vh;
                opacity: 0;
                transform: translateX(50px);
            }
        }

        /* 闪烁文字 */
        .glow-text {
            position: fixed;
            pointer-events: none;
            z-index: 9994;
            font-size: 24px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.4);
            text-shadow: 0 0 10px rgba(255, 107, 107, 0.3), 0 0 20px rgba(224, 86, 253, 0.2), 0 0 30px rgba(102, 126, 234, 0.1);
            animation: glowPulse 0.8s ease-in-out infinite;
            opacity: 0.3;
        }

        @keyframes glowPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.3);
            }
        }

        /* 玫瑰花瓣 */
        .petal {
            position: fixed;
            pointer-events: none;
            z-index: 9993;
            font-size: 24px;
            animation: petalFall linear infinite;
        }

        @keyframes petalFall {
            0% {
                top: -30px;
                opacity: 1;
                transform: translateX(0) rotate(0deg);
            }
            100% {
                top: 100vh;
                opacity: 0;
                transform: translateX(200px) rotate(720deg);
            }
        }

        /* 顶部情话文字 */
        .love-quote {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            text-shadow: 
                0 0 10px rgba(255, 107, 107, 0.8),
                0 0 20px rgba(224, 86, 253, 0.6),
                0 0 30px rgba(102, 126, 234, 0.4),
                2px 2px 4px rgba(0, 0, 0, 0.5);
            animation: quoteGlow 2s ease-in-out infinite;
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            backdrop-filter: blur(5px);
            white-space: nowrap;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            .love-quote {
                font-size: 14px;
                padding: 8px 16px;
                top: 10px;
                white-space: normal;
                text-align: center;
                max-width: 90%;
            }
        }

        @keyframes quoteGlow {
            0%, 100% {
                text-shadow: 
                    0 0 10px rgba(255, 107, 107, 0.8),
                    0 0 20px rgba(224, 86, 253, 0.6),
                    0 0 30px rgba(102, 126, 234, 0.4),
                    2px 2px 4px rgba(0, 0, 0, 0.5);
                transform: translateX(-50%) scale(1);
            }
            50% {
                text-shadow: 
                    0 0 20px rgba(255, 107, 107, 1),
                    0 0 30px rgba(224, 86, 253, 0.8),
                    0 0 40px rgba(102, 126, 234, 0.6),
                    2px 2px 6px rgba(0, 0, 0, 0.6);
                transform: translateX(-50%) scale(1.05);
            }
        }

        /* 照片标题 */
        .photo-caption {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.3s ease;
            cursor: pointer;
            user-select: none;
        }

        .photo-caption:hover {
            transform: translateX(-50%) scale(1.05);
            background: rgba(255, 107, 107, 0.6);
        }

        .photo-caption::before {
            content: '✏️ ';
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .photo-caption:hover::before {
            opacity: 1;
        }

        .photo-caption.show {
            opacity: 1;
            pointer-events: all;
        }
            opacity: 1;
        }

        /* 音乐控制按钮 */
        .music-control {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10000;
            width: 50px;
            height: 50px;
            background: rgba(255, 107, 107, 0.9);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
            transition: all 0.3s ease;
        }

        .music-control:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 107, 107, 0.6);
        }

        .music-control.show {
            display: flex;
        }

        .music-control::before {
            content: '🎵';
            font-size: 24px;
        }

        .music-control.paused::before {
            content: '🔇';
        }

        /* 切换照片按钮 */
        .nav-button {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            z-index: 10000;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            font-size: 24px;
            color: #fff;
            user-select: none;
        }

        .nav-button:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: translateY(-50%) scale(1.1);
        }

        .nav-button.show {
            display: flex;
        }

        .nav-prev {
            left: 20px;
        }

        .nav-next {
            right: 20px;
        }

        /* 天数计数器 */
        .days-counter {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10000;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
            padding: 8px 16px;
            background: rgba(255, 107, 107, 0.8);
            border-radius: 20px;
            backdrop-filter: blur(5px);
            opacity: 0;
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .days-counter.show {
            opacity: 1;
        }

        /* 随机留言 */
        /* 点击爱心爆炸 */
        .click-heart {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            font-size: 30px;
            animation: clickHeartAnim 1s ease-out forwards;
        }

        @keyframes clickHeartAnim {
            0% {
                transform: scale(0) rotate(0deg);
                opacity: 1;
            }
            50% {
                transform: scale(1.5) rotate(180deg);
                opacity: 1;
            }
            100% {
                transform: scale(0.5) translateY(-100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* 鼠标轨迹星星 */
        .trail-star {
            position: fixed;
            pointer-events: none;
            z-index: 9998;
            font-size: 16px;
            animation: trailFade 1s ease-out forwards;
        }

        @keyframes trailFade {
            0% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
            100% {
                opacity: 0;
                transform: scale(0) rotate(180deg);
            }
        }

        /* 照片放大查看 */
        .photo-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 20000;
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .photo-modal.show {
            display: flex;
            opacity: 1;
        }

        .photo-modal img {
            max-width: 90%;
            max-height: 90%;
            border-radius: 10px;
            box-shadow: 0 0 50px rgba(255, 255, 255, 0.3);
        }

        .photo-modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 40px;
            color: #fff;
            cursor: pointer;
            z-index: 20001;
            user-select: none;
        }

        /* 随机留言墙 */
        .sweet-message {
            position: fixed;
            bottom: 150px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(255, 255, 255, 0.95);
            padding: 15px 30px;
            border-radius: 25px;
            box-shadow: 0 5px 20px rgba(255, 107, 107, 0.3);
            font-size: 18px;
            color: #ff6b6b;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.5s ease, transform 0.3s ease;
            white-space: nowrap;
            cursor: pointer;
            user-select: none;
        }

        .sweet-message:hover {
            transform: translateX(-50%) scale(1.05);
            box-shadow: 0 5px 25px rgba(255, 107, 107, 0.5);
        }

        .sweet-message::before {
            content: '✏️ ';
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sweet-message:hover::before {
            opacity: 1;
        }

        .sweet-message.show {
            opacity: 1;
            pointer-events: all;
        }

        @media (max-width: 480px) {
            .photo-caption {
                font-size: 14px;
                bottom: 60px;
            }
            .days-counter {
                font-size: 13px;
                top: 50px;
            }
            .sweet-message {
                font-size: 14px;
                padding: 10px 20px;
                bottom: 120px;
                max-width: 90%;
                white-space: normal;
                text-align: center;
            }
            .nav-button {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }
            .music-control {
                width: 45px;
                height: 45px;
            }
        }

        /* 加载动画 */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            z-index: 30000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        .loading-screen.hide {
            opacity: 0;
            pointer-events: none;
        }

        .loading-heart {
            font-size: 80px;
            animation: loadingPulse 1s ease-in-out infinite;
        }

        @keyframes loadingPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        .loading-text {
            margin-top: 20px;
            font-size: 24px;
            color: #fff;
            font-weight: bold;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <!-- 加载屏幕 -->
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-heart">💖</div>
        <div class="loading-text">加载中...</div>
    </div>

    <!-- 图片轮播容器 -->
    <div class="slideshow-container">
        <div class="slideshow-image active" style="background-image: url('b4905be51364e250a2efb345e0d5c61c.jpg');"></div>
        <div class="slideshow-image" style="background-image: url('45e20ee077ee5171afee468420e7bea4.jpg');"></div>
        <div class="slideshow-image" style="background-image: url('8dc9360fcec44aa9e5eb00a90919d0f7.jpg');"></div>
        <div class="slideshow-image" style="background-image: url('eb670559bf77b6a85fc58432f9d9e949.jpg');"></div>
        <div class="slideshow-image" style="background-image: url('1593d5d918aa9f86d1415be6380eed15.jpg');"></div>
    </div>

    <!-- 背景音乐 -->
    <audio id="bgMusic" loop>
        <source src="齐晨 - 咱们结婚吧 (铃声版).mp3" type="audio/mpeg">
    </audio>

    <!-- 顶部情话 -->
    <div class="love-quote">💔😭目光所及皆是你，亿万星辰不及你😭💔</div>

    <!-- 照片标题 -->
    <div class="photo-caption" id="photoCaption"></div>

    <!-- 天数计数器 -->
    <div class="days-counter" id="daysCounter"></div>

    <!-- 音乐控制 -->
    <div class="music-control" id="musicControl"></div>

    <!-- 随机留言墙 -->
    <div class="sweet-message" id="sweetMessage">你是我的唯一 💕</div>

    <!-- 照片切换按钮 -->
    <div class="nav-button nav-prev show" id="navPrev">◀</div>
    <div class="nav-button nav-next show" id="navNext">▶</div>

    <!-- 照片放大查看 -->
    <div class="photo-modal" id="photoModal">
        <div class="photo-modal-close" onclick="closePhotoModal()">✕</div>
        <img id="modalImage" src="" alt="放大查看">
    </div>

    <div class="container">
        <div class="heart-bg">❤️</div>
        <div class="question">1 + 1 = ?</div>
        <div class="input-group">
            <input type="text" id="answer" placeholder="请输入答案" maxlength="10" inputmode="numeric">
        </div>
        <button onclick="checkAnswer()">提交</button>
        <div class="error" id="error">答案不对哦，再想想~</div>
        <div class="message" id="message">我爱你媳妇 ❤️</div>
    </div>

    <script>
        const input = document.getElementById('answer');
        const message = document.getElementById('message');
        const error = document.getElementById('error');
        const button = document.querySelector('button');

        // 照片信息配置
        const photoData = [
            { src: 'b4905be51364e250a2efb345e0d5c61c.jpg', caption: '2026.00.00 - 我们第一次相遇 💕' },
            { src: '45e20ee077ee5171afee468420e7bea4.jpg', caption: '2026.05.21 - 最美的笑容 😊' },
            { src: '8dc9360fcec44aa9e5eb00a90919d0f7.jpg', caption: '0000.00.00 - 一起看日落 🌅' },
            { src: 'eb670559bf77b6a85fc58432f9d9e949.jpg', caption: '0000.00.00 - 永远在一起 ❤️' },
            { src: '1593d5d918aa9f86d1415be6380eed15.jpg', caption: '2027.09.09 - 我们的纪念日 💖' }
        ];

        // 恋爱开始日期（请修改为你们的真实日期）
        const startDate = new Date('0000-00-00');

        // 特殊纪念日配置
        const specialDays = {
            '13-14': '🎉 永远爱你！🎉',
            '05-21': '💝 情人节快乐！我的唯一！💝',
            '05-20': '💕 520 我爱你！💕',
        };

        // 甜蜜留言库
        const sweetMessages = [
            '你是我的唯一 💕',
            '余生都是你 ❤️',
            '有你真好 💖',
            '想和你去看所有的风景 🌸',
            '你笑起来真好看 😊',
            '永远爱你不变 💗',
            '你是我的小幸运 🍀',
            '每天都想见到你 💝',
            '在一起的每一天都是最好的一天 🌈',
            '你是我的全世界 🌍'
        ];

        let currentPhotoIndex = 0;
        let clickCount = 0;
        let clickTimer = null;
        let trailEnabled = true;

        // 检测设备性能，移动端减少特效
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        const effectMultiplier = isMobile ? 0.5 : 1; // 移动端特效减半

        // 回车键提交
        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkAnswer();
            }
        });

        function checkAnswer() {
            const answer = input.value.trim();

            if (answer === '2') {
                // 先播放音乐（在用户交互时）
                const bgMusic = document.getElementById('bgMusic');
                bgMusic.play().catch(err => {
                    console.log('音乐播放失败:', err);
                });
                
                // 正确答案
                error.style.display = 'none';
                message.style.display = 'block';
                input.disabled = true;
                button.style.display = 'none';

                // 启动所有爱的动画
                startLoveShow();
            } else if (answer === '0114' || answer === '01-14' || answer === '1-14') {
                // 隐藏彩蛋：输入纪念日日期
                error.style.display = 'none';
                const container = document.querySelector('.container');
                const questionEl = container.querySelector('.question');
                questionEl.textContent = '💖 你记得我们的纪念日！💖';
                questionEl.style.fontSize = '32px';
                input.value = '';
                input.placeholder = '现在输入正确答案吧~';
                
                // 触发小型庆祝
                for (let i = 0; i < 20; i++) {
                    setTimeout(() => {
                        const heart = document.createElement('div');
                        heart.style.position = 'fixed';
                        heart.style.left = Math.random() * 100 + '%';
                        heart.style.top = '-50px';
                        heart.style.fontSize = '30px';
                        heart.textContent = ['❤️', '💕', '💖'][Math.floor(Math.random() * 3)];
                        heart.style.animation = 'fall 3s linear forwards';
                        heart.style.zIndex = '9999';
                        heart.style.pointerEvents = 'none';
                        document.body.appendChild(heart);
                        setTimeout(() => heart.remove(), 3000);
                    }, i * 100);
                }
            } else {
                // 错误答案
                error.style.display = 'block';
                message.style.display = 'none';
                input.value = '';
                input.focus();

                // 摇晃效果
                input.style.animation = 'shake 0.5s';
                setTimeout(() => {
                    input.style.animation = '';
                }, 500);
            }
        }

        function startLoveShow() {
            // 隐藏答题框
            const container = document.querySelector('.container');
            container.classList.add('hide');
            
            // 从本地存储加载数据
            loadFromStorage();
            
            // 切换背景为图片
            document.body.classList.add('show-background');
            
            // 显示音乐控制
            document.getElementById('musicControl').classList.add('show');
            
            // 显示天数计数器
            updateDaysCounter();
            document.getElementById('daysCounter').classList.add('show');
            
            // 显示随机留言
            updateRandomMessage();
            document.getElementById('sweetMessage').classList.add('show');
            
            // 启动图片轮播
            startSlideshow();
            
            // 立即爆发动画
            createBigHeart();
            createRings();
            createFireworks();

            // 持续动画
            startFallingEffect();
            startRisingHearts();
            startSparkles();
            startBubbles();
            startPetals();
            startGlowTexts();
            
            // 启动互动功能
            enableInteractions();
            
            // 每10秒更换一次留言
            setInterval(updateRandomMessage, 10000);
        }

        function startSlideshow() {
            const images = document.querySelectorAll('.slideshow-image');
            updatePhotoCaption(0);

            // 每5秒切换一张图片
            setInterval(() => {
                changePhoto(1);
            }, 5000);
        }

        function changePhoto(direction) {
            const images = document.querySelectorAll('.slideshow-image');
            images[currentPhotoIndex].classList.remove('active');
            
            currentPhotoIndex = (currentPhotoIndex + direction + images.length) % images.length;
            
            images[currentPhotoIndex].classList.add('active');
            updatePhotoCaption(currentPhotoIndex);
        }

        function updatePhotoCaption(index) {
            const caption = document.getElementById('photoCaption');
            caption.textContent = photoData[index].caption;
            caption.classList.remove('show');
            setTimeout(() => caption.classList.add('show'), 100);
        }

        function updateDaysCounter() {
            const today = new Date();
            const diffTime = Math.abs(today - startDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            // 检查是否是特殊纪念日
            const monthDay = String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
            if (specialDays[monthDay]) {
                document.querySelector('.love-quote').textContent = specialDays[monthDay];
                // 触发特殊庆祝动画
                setTimeout(() => triggerSpecialSurprise(), 2000);
            }
            
            document.getElementById('daysCounter').textContent = `💑 在一起第 ${diffDays} 天 💑`;
        }

        // 从本地存储加载数据
        function loadFromStorage() {
            // 加载照片数据
            const savedPhotos = localStorage.getItem('photoData');
            if (savedPhotos) {
                const loaded = JSON.parse(savedPhotos);
                loaded.forEach((item, index) => {
                    if (photoData[index]) {
                        photoData[index].caption = item.caption;
                    }
                });
            }

            // 加载留言数据
            const savedMessages = localStorage.getItem('sweetMessages');
            if (savedMessages) {
                const loaded = JSON.parse(savedMessages);
                sweetMessages.length = 0;
                sweetMessages.push(...loaded);
            }
        }

        // 保存到本地存储
        function saveToStorage() {
            localStorage.setItem('photoData', JSON.stringify(photoData));
            localStorage.setItem('sweetMessages', JSON.stringify(sweetMessages));
        }

        // 编辑照片标题
        function editPhotoCaption(index) {
            const currentCaption = photoData[index].caption;
            const newCaption = prompt('✏️ 修改当前照片标题：', currentCaption);
            if (newCaption !== null && newCaption.trim() !== '') {
                photoData[index].caption = newCaption.trim();
                saveToStorage();
                updatePhotoCaption(currentPhotoIndex);
                alert('✅ 修改成功！已保存');
            }
        }

        // 当前显示的留言索引
        let currentMessageIndex = 0;

        // 编辑留言墙 - 只编辑当前这一条
        function editCurrentMessage() {
            const currentMsg = sweetMessages[currentMessageIndex];
            const newMsg = prompt('✏️ 修改当前留言：', currentMsg);
            if (newMsg !== null && newMsg.trim() !== '') {
                sweetMessages[currentMessageIndex] = newMsg.trim();
                saveToStorage();
                updateRandomMessage();
                alert('✅ 修改成功！已保存');
            }
        }

        function updateRandomMessage() {
            const messageEl = document.getElementById('sweetMessage');
            currentMessageIndex = Math.floor(Math.random() * sweetMessages.length);
            const randomMsg = sweetMessages[currentMessageIndex];
            messageEl.textContent = randomMsg;
            messageEl.classList.remove('show');
            setTimeout(() => messageEl.classList.add('show'), 100);
        }

        function enableInteractions() {
            // 音乐控制
            const musicControl = document.getElementById('musicControl');
            const bgMusic = document.getElementById('bgMusic');
            musicControl.addEventListener('click', (e) => {
                e.stopPropagation(); // 阻止触发背景点击事件
                if (bgMusic.paused) {
                    bgMusic.play();
                    musicControl.classList.remove('paused');
                } else {
                    bgMusic.pause();
                    musicControl.classList.add('paused');
                }
            });

            // 照片切换按钮
            document.getElementById('navPrev').addEventListener('click', (e) => {
                e.stopPropagation();
                changePhoto(-1);
            });
            document.getElementById('navNext').addEventListener('click', (e) => {
                e.stopPropagation();
                changePhoto(1);
            });

            // 点击屏幕爱心爆炸 + 2连击彩蛋
            document.body.addEventListener('click', (e) => {
                // 检测2连击彩蛋
                clickCount++;
                clearTimeout(clickTimer);
                clickTimer = setTimeout(() => { clickCount = 0; }, 500); // 0.5秒内连续点击2次
                
                if (clickCount === 2) {
                    triggerSpecialSurprise();
                    clickCount = 0;
                }
                
                // 普通点击爱心
                createClickHeart(e.clientX, e.clientY);
            });

            // 鼠标轨迹星星（仅桌面端）
            if (!isMobile) {
                let lastTrailTime = 0;
                document.body.addEventListener('mousemove', (e) => {
                    const now = Date.now();
                    if (trailEnabled && now - lastTrailTime > 100) {
                        createTrailStar(e.clientX, e.clientY);
                        lastTrailTime = now;
                    }
                });
            }

            // 点击照片放大
            document.querySelectorAll('.slideshow-image').forEach(img => {
                img.addEventListener('click', (e) => {
                    e.stopPropagation();
                    openPhotoModal(photoData[currentPhotoIndex].src);
                });
            });

            // 点击照片标题编辑
            document.getElementById('photoCaption').addEventListener('click', (e) => {
                e.stopPropagation();
                editPhotoCaption(currentPhotoIndex);
            });

            // 点击留言墙编辑当前这一条
            document.getElementById('sweetMessage').addEventListener('click', (e) => {
                e.stopPropagation();
                editCurrentMessage();
            });
        }

        function createClickHeart(x, y) {
            const hearts = ['❤️', '💕', '💖', '💗', '💓', '💞'];
            for (let i = 0; i < 6; i++) {
                const heart = document.createElement('div');
                heart.className = 'click-heart';
                heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                heart.style.left = x + 'px';
                heart.style.top = y + 'px';
                heart.style.animationDelay = (i * 0.1) + 's';
                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 1000);
            }
        }

        function createTrailStar(x, y) {
            const stars = ['✨', '⭐', '🌟', '💫'];
            const star = document.createElement('div');
            star.className = 'trail-star';
            star.textContent = stars[Math.floor(Math.random() * stars.length)];
            star.style.left = x + 'px';
            star.style.top = y + 'px';
            document.body.appendChild(star);
            setTimeout(() => star.remove(), 1000);
        }

        function triggerSpecialSurprise() {
            // 特殊彩蛋：超级爱心雨
            const oldQuote = document.querySelector('.love-quote').textContent;
            document.querySelector('.love-quote').textContent = '🎉🎉 你触发了隐藏彩蛋！超级爱你！🎉🎉';
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    createRisingHeart();
                    createBigHeart();
                }, i * 50);
            }
            
            setTimeout(() => {
                document.querySelector('.love-quote').textContent = oldQuote;
            }, 5000);
        }

        function openPhotoModal(src) {
            const modal = document.getElementById('photoModal');
            const modalImg = document.getElementById('modalImage');
            modalImg.src = src;
            modal.classList.add('show');
        }

        function closePhotoModal() {
            document.getElementById('photoModal').classList.remove('show');
        }

        function startFallingEffect() {
            // 创建下落文字 - 根据设备性能调整数量
            const count = Math.floor(5 * effectMultiplier);
            for (let i = 0; i < count; i++) {
                setTimeout(() => createFallingText(), i * 400);
            }
            setInterval(createFallingText, 2500);
        }

        function startRisingHearts() {
            const count = Math.floor(8 * effectMultiplier);
            for (let i = 0; i < count; i++) {
                setTimeout(() => createRisingHeart(), i * 400);
            }
            setInterval(createRisingHeart, 2000);
        }

        function startSparkles() {
            const count = Math.floor(6 * effectMultiplier);
            for (let i = 0; i < count; i++) {
                setTimeout(() => createSparkle(), i * 500);
            }
            setInterval(createSparkle, 1500);
        }

        function startBubbles() {
            const count = Math.floor(5 * effectMultiplier);
            for (let i = 0; i < count; i++) {
                setTimeout(() => createBubble(), i * 800);
            }
            setInterval(createBubble, 3000);
        }

        function startPetals() {
            const count = Math.floor(6 * effectMultiplier);
            for (let i = 0; i < count; i++) {
                setTimeout(() => createPetal(), i * 600);
            }
            setInterval(createPetal, 2000);
        }

        function startGlowTexts() {
            const count = Math.floor(3 * effectMultiplier);
            for (let i = 0; i < count; i++) {
                setTimeout(() => createGlowText(), i * 1000);
            }
            setInterval(createGlowText, 3500);
        }

        function createFallingText() {
            const texts = ['我爱你媳妇 ❤️', '永远爱你 ❤️', '你是我的宝贝 ❤️', '爱你哦 ❤️'];
            const text = document.createElement('div');
            text.className = 'falling';
            text.textContent = texts[Math.floor(Math.random() * texts.length)];
            text.style.left = Math.random() * 100 + '%';
            text.style.fontSize = (16 + Math.random() * 16) + 'px';
            text.style.color = 'rgba(255, 107, 107, 0.4)';
            text.style.animationDuration = (5 + Math.random() * 5) + 's';
            document.body.appendChild(text);

            setTimeout(() => text.remove(), 12000);
        }

        function createRisingHeart() {
            const hearts = ['❤️', '💕', '💖', '💗', '💓', '💞', '💝', '🌹'];
            const heart = document.createElement('div');
            heart.className = 'rising-heart';
            heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.fontSize = (20 + Math.random() * 30) + 'px';
            heart.style.animationDuration = (4 + Math.random() * 4) + 's';
            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), 10000);
        }

        function createSparkle() {
            const sparkles = ['✨', '⭐', '🌟', '💫'];
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            sparkle.textContent = sparkles[Math.floor(Math.random() * sparkles.length)];
            
            // 只在四个角落生成星星
            const corner = Math.floor(Math.random() * 4);
            if (corner === 0) { // 左上角
                sparkle.style.left = Math.random() * 20 + '%';
                sparkle.style.top = Math.random() * 20 + '%';
            } else if (corner === 1) { // 右上角
                sparkle.style.left = (80 + Math.random() * 20) + '%';
                sparkle.style.top = Math.random() * 20 + '%';
            } else if (corner === 2) { // 左下角
                sparkle.style.left = Math.random() * 20 + '%';
                sparkle.style.top = (80 + Math.random() * 20) + '%';
            } else { // 右下角
                sparkle.style.left = (80 + Math.random() * 20) + '%';
                sparkle.style.top = (80 + Math.random() * 20) + '%';
            }
            
            sparkle.style.fontSize = (16 + Math.random() * 20) + 'px';
            document.body.appendChild(sparkle);

            setTimeout(() => sparkle.remove(), 4000);
        }

        function createBubble() {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const size = 20 + Math.random() * 50;
            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';
            // 只在屏幕两侧生成（左边0-25%，右边75-100%）
            const leftSide = Math.random() < 0.5;
            if (leftSide) {
                bubble.style.left = Math.random() * 25 + '%';
            } else {
                bubble.style.left = (75 + Math.random() * 25) + '%';
            }
            bubble.style.animationDuration = (8 + Math.random() * 6) + 's';
            document.body.appendChild(bubble);

            setTimeout(() => bubble.remove(), 14000);
        }

        function createPetal() {
            const petals = ['🌸', '🌺', '🌹', '🌷', '💐'];
            const petal = document.createElement('div');
            petal.className = 'petal';
            petal.textContent = petals[Math.floor(Math.random() * petals.length)];
            petal.style.left = Math.random() * 100 + '%';
            petal.style.fontSize = (16 + Math.random() * 16) + 'px';
            petal.style.animationDuration = (6 + Math.random() * 5) + 's';
            document.body.appendChild(petal);

            setTimeout(() => petal.remove(), 11000);
        }

        function createGlowText() {
            const texts = ['❤️ 爱 ❤️', '💕 永远 💕', '❤️ 你 ❤️', '💖 在一起 💖'];
            const text = document.createElement('div');
            text.className = 'glow-text';
            text.textContent = texts[Math.floor(Math.random() * texts.length)];
            text.style.left = Math.random() * 80 + '%';
            text.style.top = Math.random() * 80 + '%';
            text.style.fontSize = (18 + Math.random() * 14) + 'px';
            document.body.appendChild(text);

            setTimeout(() => text.remove(), 3000);
        }

        function createBigHeart() {
            const hearts = ['❤️', '💖', '💕'];
            for (let i = 0; i < 5; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'big-heart';
                    heart.textContent = hearts[Math.floor(Math.random() * hearts.length)];
                    heart.style.left = (20 + Math.random() * 60) + '%';
                    heart.style.top = (20 + Math.random() * 60) + '%';
                    heart.style.fontSize = '80px';
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 2000);
                }, i * 300);
            }
        }

        function createRings() {
            for (let i = 0; i < 3; i++) {
                setTimeout(() => {
                    const ring = document.createElement('div');
                    ring.className = 'ring';
                    document.body.appendChild(ring);
                    setTimeout(() => ring.remove(), 2000);
                }, i * 400);
            }
        }

        function createFireworks() {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f9ca24', '#6c5ce7', '#ff9ff3', '#feca57'];
            for (let i = 0; i < 60; i++) {
                setTimeout(() => {
                    const firework = document.createElement('div');
                    firework.style.position = 'fixed';
                    firework.style.left = Math.random() * 100 + '%';
                    firework.style.top = Math.random() * 80 + '%';
                    firework.style.width = '8px';
                    firework.style.height = '8px';
                    firework.style.borderRadius = '50%';
                    firework.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    firework.style.pointerEvents = 'none';
                    firework.style.zIndex = '9990';
                    firework.style.boxShadow = `0 0 20px ${firework.style.backgroundColor}`;
                    firework.style.animation = 'explode 1.2s ease-out forwards';
                    document.body.appendChild(firework);

                    setTimeout(() => firework.remove(), 1200);
                }, i * 40);
            }
        }

        // 添加摇晃动画和爆炸动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25% { transform: translateX(-10px); }
                75% { transform: translateX(10px); }
            }
            @keyframes explode {
                0% {
                    transform: scale(1);
                    opacity: 1;
                }
                100% {
                    transform: scale(0) translate(${Math.random() * 200 - 100}px, ${Math.random() * 200 - 100}px);
                    opacity: 0;
                }
            }
        `;
        document.head.appendChild(style);

        // 自动聚焦输入框
        input.focus();

        // 页面加载完成后隐藏加载屏幕
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loadingScreen').classList.add('hide');
            }, 500);
        });

        // 如果3秒后还没加载完，也隐藏加载屏幕
        setTimeout(() => {
            document.getElementById('loadingScreen').classList.add('hide');
        }, 3000);
    </script>
</body>
</html>
